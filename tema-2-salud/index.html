sas diversas","Siempre se contagian","Solo las causan virus"],["Completa: los agentes que causan infecciones se llaman ___.","patógenos"],["¿Qué ejemplo es una enfermedad infecciosa?","Gripe","Hipertensión arterial","Miopía"],["¿Qué opción es un síntoma?","Sensación de mareo","Temperatura medida con termómetro","Erupción visible"],["¿Qué opción es un signo?","Fiebre medida","Sensación de cansancio","Dolor percibido"],["¿Cuál es una causa posible de enfermedad no infecciosa?","Alteración genética","Contagio vírico","Infección bacteriana"],["Completa: una enfermedad es una ___ del funcionamiento normal del organismo.","alteración"],["¿Qué relación es correcta?","Virus — infección","Gen — contagio","Contaminación — virus"],["¿Por qué no toda enfermedad es contagiosa?","Muchas no se deben a agentes infecciosos","Todas se transmiten por el aire","Solo enferman personas mayores"],["¿Qué ejemplo se asocia a una enfermedad nutricional?","Carencia prolongada de nutrientes","Infección por virus","Picadura con patógeno"],["¿Qué opción reúne dos enfermedades no infecciosas?","Diabetes e hipertensión","Gripe y sarampión","Varicela y gripe"],["Completa: las enfermedades pueden ser infecciosas y no ___.","infecciosas"],["¿Qué diferencia un patógeno de una célula defensiva?","El patógeno puede causar enfermedad","La célula defensiva causa toda infección","Ambos son siempre virus"],["¿Qué afirmación es más rigurosa?","Una enfermedad puede tener varias causas","Toda enfermedad tiene una sola causa","Los hábitos no influyen nunca"],["¿Qué grupo incluye hongos que causan enfermedad?","Agentes infecciosos","Tejidos humanos","Hormonas"],["¿Qué información ayuda a distinguir enfermedades?","Causa, signos y síntomas","Solo la edad del paciente","Solo la temperatura exterior"],["Completa: el dolor es un ___ percibido por la persona.","síntoma"]]},{"title":"Las enfermedades infecciosas","intro":"Los agentes infecciosos pueden transmitirse de distintas formas. Tras la entrada del patógeno, una infección puede pasar por incubación, desarrollo y convalecencia.","points":[["Contagio directo","Contacto próximo entre personas o con fluidos infectados."],["Contagio indirecto","Agua, alimentos, objetos contaminados o vectores, como algunos mosquitos."],["Fases","Incubación: el patógeno se multiplica; desarrollo: aparecen manifestaciones; convalecencia: recuperación."]],"q":[["¿Qué es un vector de una enfermedad?","Organismo que transmite un patógeno","Medicamento preventivo","Célula que produce anticuerpos"],["¿Qué ejemplo es transmisión indirecta?","Picadura de mosquito vector","Contacto directo de piel","Contacto íntimo entre personas"],["¿Qué sucede durante la incubación?","El patógeno se multiplica antes de los síntomas","La persona ya está recuperada","Siempre desaparece el patógeno"],["¿Qué fase sigue habitualmente al desarrollo?","Convalecencia","Incubación","Contagio inicial"],["Completa: la fase de recuperación se llama ___.","convalecencia"],["¿Qué vehículo puede transmitir patógenos?","Agua contaminada","Agua potable controlada","Material esterilizado"],["¿Qué significa que una enfermedad sea contagiosa?","Puede transmitirse entre individuos","Siempre es hereditaria","Nunca intervienen patógenos"],["¿Qué medida reduce el contagio por alimentos?","Higiene y cocción adecuada","Compartir cubiertos sucios","Conservar comida sin refrigerar"],["¿Qué agente causa la gripe?","Virus","Hongo","Protozoo"],["Completa: la fase inicial sin síntomas aparentes se llama ___.","incubación"],["¿Qué ejemplo muestra un vector?","Mosquito que transmite un patógeno","Persona que se lava las manos","Termómetro clínico"],["¿Qué vía de entrada pueden usar algunos patógenos?","Vía respiratoria","Solo el cabello","Solo las uñas"],["¿Por qué lavarse las manos reduce infecciones?","Disminuye el transporte de microorganismos","Elimina toda enfermedad hereditaria","Sustituye a las vacunas"],["¿Qué diferencia contagio directo e indirecto?","La intervención de intermediarios","La gravedad de la fiebre","El tamaño del patógeno"],["Completa: los organismos que transmiten algunos patógenos se denominan ___.","vectores"],["¿Qué medida ayuda frente a infecciones respiratorias?","Ventilar espacios cerrados","Compartir pañuelos","Ignorar la higiene"],["¿Qué sucede en la fase de desarrollo?","Se manifiestan síntomas y signos","No existe ningún patógeno","Siempre se ha producido la curación"],["¿Qué es un portador asintomático?","Persona que alberga un patógeno sin síntomas","Persona inmune a toda enfermedad","Persona con enfermedad hereditaria"],["¿Qué práctica limita el contagio indirecto?","Desinfectar superficies compartidas","Compartir objetos contaminados","Beber agua sin control"],["Completa: la transmisión de una infección se denomina ___.","contagio"]]},{"title":"El sistema inmunitario","intro":"El organismo dispone de defensas externas e internas. La respuesta inespecífica actúa de forma general, mientras que la específica reconoce antígenos y puede generar memoria inmunitaria.","points":[["Defensas externas","Piel, mucosas y secreciones que dificultan la entrada de patógenos."],["Respuesta inespecífica","Inflamación y actuación de células fagocíticas frente a muchos agentes."],["Respuesta específica","Linfocitos y anticuerpos dirigidos frente a antígenos determinados; puede generar memoria."]],"q":[["¿Cuál es una defensa externa?","Piel","Anticuerpo circulante","Linfocito activado"],["¿Qué es la fagocitosis?","Captura e ingestión de partículas por células","Fabricación de glóbulos rojos","Transmisión de un virus"],["¿Qué respuesta actúa frente a muchos patógenos sin reconocer uno concreto?","Inespecífica","Específica","Hereditaria"],["¿Qué moléculas reconocen antígenos de forma específica?","Anticuerpos","Glucosa","Hemoglobina"],["Completa: las células que participan en la respuesta específica son los ___.","linfocitos"],["¿Qué función tiene la piel intacta?","Dificultar la entrada de patógenos","Producir todos los anticuerpos","Transportar const app=document.getElementById('app');let mode='home',section=0,qi=0,score=0,selected=null,answered=false,order=[],pool=[];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function goHome(){mode='home';render()}function render(){if(mode==='home')home();if(mode==='study')study();if(mode==='menu')menu();if(mode==='quiz')quiz()}function home(){app.innerHTML='<section class="hero"><div class="brand"><img src="https://lh3.googleusercontent.com/d/1WeIYAMOFlcv3kPd4pxc98xDL_bjSCeJP" alt="Colegio Punta Galea"></div><div class="personal"><img src="https://lh3.googleusercontent.com/d/1sSeszhTZ3p-2lpj3ihYxPJ-DRpsfq7sg" alt="Logo Biología Maite Villadóniga">© Maite Villadóniga</div><div class="eyebrow">Tema 2 · Salud y enfermedad</div><h1>¿Cómo protege nuestro cuerpo la salud?</h1><p>Descubre los factores que afectan a la salud, cómo se transmiten las infecciones y cómo actúan nuestras defensas.</p><div class="illustration" aria-label="Salud, microorganismos, inmunidad y donación"><span>🫀</span><span>🦠</span><span>🛡️</span><span>🩺</span></div><div class="actions"><button class="primary" onclick="mode=\'study\';section=0;render()">📖 Aprender el tema</button><button class="secondary" onclick="mode=\'menu\';render()">✏️ Practicar para el examen</button></div></section><h2 style="margin-top:40px">Índice del tema</h2><div class="grid">'+B.map((b,i)=>'<div class="tile"><button onclick="mode=\'study\';section='+i+';render()"><h3>'+String(i+1).padStart(2,'0')+' · '+b.title+'</h3><small>Estudiar el apartado →</small></button></div>').join('')+'</div>'}
function study(){const b=B[section],v=visualSections[section];app.innerHTML='<div class="study"><div class="eyebrow">Aprende · '+(section+1)+' de '+B.length+'</div><h2>'+b.title+'</h2><div class="lead">'+v.lead+'</div><div class="grid">'+v.cards.map(p=>'<article class="detail"><img src="'+p[2]+'" alt="'+p[0]+'" loading="lazy" onerror="this.style.display=\'none\'"><h3>'+p[0]+'</h3><p>'+p[1]+'</p></article>').join('')+'</div></div><div class="nav"><button class="secondary" onclick="section=Math.max(0,section-1);render()">← Anterior</button><button class="primary" onclick="startQuiz('+section+')">Practicar este apartado</button><button class="secondary" onclick="section=Math.min(B.length-1,section+1);render()">Siguiente →</button></div>'}
function menu(){app.innerHTML='<div class="eyebrow">Autoevaluación</div><h2>Practica y prepárate para el examen</h2><p>Elige un epígrafe para responder a sus 20 preguntas o practica con preguntas mezcladas. Hay preguntas de elección múltiple y de completar.</p><div class="grid">'+B.map((b,i)=>'<div class="tile"><h3>'+b.title+'</h3><p class="hint">20 preguntas · corrección inmediata</p><button class="primary" onclick="startQuiz('+i+')">Empezar →</button></div>').join('')+'<div class="tile"><h3>🔀 Repaso de todo el tema</h3><p class="hint">20 preguntas mezcladas</p><button class="primary" onclick="startQuiz(-1)">Empezar →</button></div></div>'}
function startQuiz(s){section=s;mode='quiz';qi=0;score=0;selected=null;answered=false;pool=s<0?shuffle(B.flatMap(b=>b.q)).slice(0,20):shuffle(B[s].q);render()}function normalize(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/\s+/g,' ')}function quiz(){if(qi>=pool.length){app.innerHTML='<div class="quizbox"><div class="eyebrow">Resultado</div><h2>'+score+' / '+pool.length+' respuestas correctas</h2><p>'+(score>=16?'¡Buen trabajo! Repasa los errores para consolidar los conceptos.':'Revisa los apartados que te han resultado más difíciles y vuelve a intentarlo.')+'</p><div class="actions"><button class="primary" onclick="startQuiz('+section+')">Repetir con otro orden</button><button class="secondary" onclick="mode=\'menu\';render()">Elegir apartado</button></div></div>';return}let q=pool[qi];let fill=q.length===2;order=fill?[]:shuffle([q[1],q[2],q[3]]);app.innerHTML='<div class="eyebrow">'+(section<0?'Repaso general':B[section].title)+'</div><h2>Pregunta '+(qi+1)+' de '+pool.length+'</h2><div class="progress"><div style="width:'+qi/pool.length*100+'%"></div></div><div class="quizbox"><h3>'+q[0]+'</h3>'+(fill?'<input class="answer" id="fill" autocomplete="off" placeholder="Escribe tu respuesta">':order.map((o,i)=>'<button class="option" onclick="choose('+i+')" id="opt'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join(''))+'<div class="actions"><button class="primary" id="check" onclick="check()">Comprobar</button><button class="secondary hidden" id="next" onclick="qi++;selected=null;answered=false;render()">Siguiente →</button></div><div id="feedback" aria-live="polite"></div></div>'}
function choose(i){if(answered)return;selected=order[i];document.querySelectorAll('.option').forEach((e,j)=>e.classList.toggle('selected',j===i))}
function check(){if(answered)return;let q=pool[qi];let v=q.length===2?document.getElementById('fill').value:selected;if(!v||!String(v).trim())return;answered=true;let ok=normalize(v)===normalize(q[1]);if(ok)score++;document.getElementById('feedback').innerHTML='<div class="feedback '+(ok?'':'bad')+'"><strong>'+(ok?'✓ Correcto':'✗ Revisa la respuesta')+'</strong><p>Respuesta esperada: <strong>'+q[1]+'</strong>.</p></div>';document.getElementById('check').classList.add('hidden');document.getElementById('next').classList.remove('hidden');document.querySelectorAll('.option').forEach(e=>e.disabled=true);let f=document.getElementById('fill');if(f)f.disabled=true}
render();
