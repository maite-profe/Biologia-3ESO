<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tema 2 · Salud y enfermedad · Biología 3.º ESO</title><style>
:root{--green:#126e55;--dark:#153c39;--light:#edf8f2;--blue:#dcecf7;--ink:#18332f;--muted:#54716b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f9f7;color:var(--ink)}header{background:linear-gradient(115deg,#115d50,#2c8b70);color:white;padding:14px 4vw;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:1.12rem}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font-weight:700}button:focus-visible{outline:3px solid #f0a43d;outline-offset:3px}.home{background:white;color:var(--green);font-size:1.4rem;padding:6px 13px}main{max-width:1180px;margin:auto;padding:clamp(20px,4vw,52px)}.hero{background:linear-gradient(120deg,#d5f0e1,#e5f1fa);border-radius:28px;padding:clamp(25px,5vw,65px)}h1{font-size:clamp(2.3rem,5vw,4.5rem);line-height:1.05;margin:12px 0}h2{font-size:clamp(1.8rem,3vw,2.8rem);margin:0 0 20px}h3{font-size:1.35rem;margin:0 0 12px}p,li{font-size:clamp(1.05rem,1.7vw,1.35rem);line-height:1.55}.eyebrow{color:var(--green);font-weight:800;letter-spacing:.09em;text-transform:uppercase}.actions,.nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:25px}.primary{background:var(--green);color:white}.secondary{background:#e3eee9;color:var(--dark)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin:22px 0}.tile{background:white;border:1px solid #d7e7df;border-radius:20px;padding:24px;box-shadow:0 4px 18px #1a5e4c0b}.tile button{width:100%;text-align:left;background:transparent;padding:0;color:var(--dark)}.tile small{display:block;color:var(--muted);font-size:.95rem;margin-top:9px}.detail{border-left:7px solid var(--green);background:white;border-radius:14px;padding:22px;margin:18px 0}.detail h3{color:var(--green)}.illustration{display:flex;align-items:center;justify-content:center;min-height:170px;background:linear-gradient(130deg,#e0f2e8,#d9e9f8);border-radius:22px;margin:24px 0;gap:12px;flex-wrap:wrap;padding:22px}.illustration span{font-size:3rem}.quizbox{background:white;border:1px solid #d8e6e0;border-radius:22px;padding:clamp(20px,4vw,38px)}.option{display:block;width:100%;text-align:left;background:#f0f6f3;border:2px solid transparent;margin:10px 0;font-weight:500}.option:hover,.option.selected{border-color:var(--green)}input.answer{width:100%;font:inherit;padding:14px;border:2px solid #a8c9bb;border-radius:12px}.feedback{margin-top:16px;padding:15px;background:#eaf5f0;border-radius:12px;font-size:1.1rem}.feedback.bad{background:#fff1e7}.progress{height:10px;background:#d7e7df;border-radius:20px;overflow:hidden;margin:20px 0}.progress>div{height:100%;background:var(--green);transition:width .2s}.hidden{display:none}.hint{font-size:1rem;color:var(--muted)}footer{padding:24px;text-align:center;color:var(--muted);font-size:.9rem}@media(min-width:900px){.study{min-height:65vh}}@media(max-width:550px){header strong{font-size:.9rem}.hero{padding:25px}button{padding:12px}}@media print{header,.nav,.actions,footer{display:none!important}body{background:white}}
</style></head><body><header><strong>🌿 BIOLOGÍA · 3.º ESO</strong><button class="home" onclick="goHome()" aria-label="Inicio">⌂</button></header><main id="app"></main><footer>Material didáctico · Tema 2 · Colegio Punta Galea · Versión de trabajo basada en el escaneo facilitado</footer><script>
const B=[{"title":"La salud y los factores de riesgo","intro":"La salud es un estado de bienestar físico, mental y social, no solo la ausencia de enfermedad. Nuestro bienestar depende de factores conductuales, biológicos y ambientales.","points":[["Conductuales","Hábitos como el tabaquismo, el consumo de alcohol, la alimentación o la actividad física."],["Biológicos","Características del organismo, predisposición genética y circunstancias como la edad."],["Ambientales","Contaminación, condiciones del entorno y exposición a agentes perjudiciales."]],"q":[["¿Qué concepto de salud es más completo?","Bienestar físico, mental y social","Ausencia de fiebre","Buen estado muscular"],["¿Qué tipo de factor es fumar?","Conductual","Biológico","Genético"],["¿Qué tipo de factor es la contaminación del aire?","Ambiental","Conductual","Hereditario"],["¿Qué factor puede modificarse directamente con hábitos?","Conductual","Edad","Herencia genética"],["Completa: la salud incluye bienestar físico, mental y ___.","social"],["¿Qué factor se relaciona con la predisposición genética?","Biológico","Ambiental","Conductual"],["¿Qué ejemplo corresponde a un factor ambiental?","Agua contaminada","Sedentarismo","Consumo de tabaco"],["¿Por qué la salud no equivale solo a no estar enfermo?","Incluye bienestar mental y social","Solo depende de la genética","Solo se mide con análisis"],["¿Cuál es un factor de riesgo conductual?","Consumo excesivo de alcohol","Edad","Calidad del aire"],["Completa: el tabaquismo es un factor de riesgo ___.","conductual"],["¿Qué medida reduce un riesgo conductual?","Realizar actividad física habitual","Cambiar la edad","Modificar los genes"],["¿Qué situación afecta principalmente al bienestar social?","Aislamiento persistente","Una fractura","Una infección bacteriana"],["¿Qué situación es un riesgo biológico?","Predisposición hereditaria","Ruido urbano","Consumo de alcohol"],["¿Qué afirmación es correcta?","Distintos factores de riesgo pueden combinarse","Los factores actúan siempre por separado","El ambiente nunca afecta a la salud"],["Completa: los factores de riesgo pueden ser conductuales, biológicos y ___.","ambientales"],["¿Qué opción distingue factor de riesgo y enfermedad?","El riesgo aumenta la probabilidad de enfermar","Todo riesgo provoca enfermedad siempre","Riesgo y enfermedad son sinónimos"],["¿Qué ejemplo une un factor conductual y otro ambiental?","Fumar y respirar aire contaminado","Edad y genética","Herencia y edad"],["¿Qué intervención actúa sobre el ambiente?","Reducir vertidos contaminantes","Dejar de fumar","Hacer ejercicio"],["¿Qué factor NO es un hábito personal?","Predisposición genética","Sedentarismo","Consumo de alcohol"],["Completa: un factor de riesgo aumenta la ___ de sufrir un daño.","probabilidad"]]},{"title":"La enfermedad","intro":"Una enfermedad es una alteración del funcionamiento normal del organismo. Se distinguen enfermedades infecciosas, causadas por agentes patógenos, y no infecciosas, que pueden tener múltiples causas.","points":[["Infecciosas","Intervienen agentes patógenos, como determinados virus, bacterias, hongos o protozoos."],["No infecciosas","No se deben a una infección; pueden ser hereditarias, degenerativas, nutricionales o de otros tipos."],["Síntomas y signos","Los síntomas los percibe la persona; los signos pueden observarse o medirse."]],"q":[["¿Qué caracteriza a una enfermedad infecciosa?","La intervención de un patógeno","Su origen siempre hereditario","La ausencia de contagio"],["¿Qué opción es una enfermedad no infecciosa?","Diabetes","Gripe","Sarampión"],["¿Qué organismo puede causar una infección?","Bacteria patógena","Glóbulo rojo","Plaqueta"],["¿Qué afirmación sobre las enfermedades no infecciosas es correcta?","Pueden tener causas diversas","Siempre se contagian","Solo las causan virus"],["Completa: los agentes que causan infecciones se llaman ___.","patógenos"],["¿Qué ejemplo es una enfermedad infecciosa?","Gripe","Hipertensión arterial","Miopía"],["¿Qué opción es un síntoma?","Sensación de mareo","Temperatura medida con termómetro","Erupción visible"],["¿Qué opción es un signo?","Fiebre medida","Sensación de cansancio","Dolor percibido"],["¿Cuál es una causa posible de enfermedad no infecciosa?","Alteración genética","Contagio vírico","Infección bacteriana"],["Completa: una enfermedad es una ___ del funcionamiento normal del organismo.","alteración"],["¿Qué relación es correcta?","Virus — infección","Gen — contagio","Contaminación — virus"],["¿Por qué no toda enfermedad es contagiosa?","Muchas no se deben a agentes infecciosos","Todas se transmiten por el aire","Solo enferman personas mayores"],["¿Qué ejemplo se asocia a una enfermedad nutricional?","Carencia prolongada de nutrientes","Infección por virus","Picadura con patógeno"],["¿Qué opción reúne dos enfermedades no infecciosas?","Diabetes e hipertensión","Gripe y sarampión","Varicela y gripe"],["Completa: las enfermedades pueden ser infecciosas y no ___.","infecciosas"],["¿Qué diferencia un patógeno de una célula defensiva?","El patógeno puede causar enfermedad","La célula defensiva causa toda infección","Ambos son siempre virus"],["¿Qué afirmación es más rigurosa?","Una enfermedad puede tener varias causas","Toda enfermedad tiene una sola causa","Los hábitos no influyen nunca"],["¿Qué grupo incluye hongos que causan enfermedad?","Agentes infecciosos","Tejidos humanos","Hormonas"],["¿Qué información ayuda a distinguir enfermedades?","Causa, signos y síntomas","Solo la edad del paciente","Solo la temperatura exterior"],["Completa: el dolor es un ___ percibido por la persona.","síntoma"]]},{"title":"Las enfermedades infecciosas","intro":"Los agentes infecciosos pueden transmitirse de distintas formas. Tras la entrada del patógeno, una infección puede pasar por incubación, desarrollo y convalecencia.","points":[["Contagio directo","Contacto próximo entre personas o con fluidos infectados."],["Contagio indirecto","Agua, alimentos, objetos contaminados o vectores, como algunos mosquitos."],["Fases","Incubación: el patógeno se multiplica; desarrollo: aparecen manifestaciones; convalecencia: recuperación."]],"q":[["¿Qué es un vector de una enfermedad?","Organismo que transmite un patógeno","Medicamento preventivo","Célula que produce anticuerpos"],["¿Qué ejemplo es transmisión indirecta?","Picadura de mosquito vector","Contacto directo de piel","Contacto íntimo entre personas"],["¿Qué sucede durante la incubación?","El patógeno se multiplica antes de los síntomas","La persona ya está recuperada","Siempre desaparece el patógeno"],["¿Qué fase sigue habitualmente al desarrollo?","Convalecencia","Incubación","Contagio inicial"],["Completa: la fase de recuperación se llama ___.","convalecencia"],["¿Qué vehículo puede transmitir patógenos?","Agua contaminada","Agua potable controlada","Material esterilizado"],["¿Qué significa que una enfermedad sea contagiosa?","Puede transmitirse entre individuos","Siempre es hereditaria","Nunca intervienen patógenos"],["¿Qué medida reduce el contagio por alimentos?","Higiene y cocción adecuada","Compartir cubiertos sucios","Conservar comida sin refrigerar"],["¿Qué agente causa la gripe?","Virus","Hongo","Protozoo"],["Completa: la fase inicial sin síntomas aparentes se llama ___.","incubación"],["¿Qué ejemplo muestra un vector?","Mosquito que transmite un patógeno","Persona que se lava las manos","Termómetro clínico"],["¿Qué vía de entrada pueden usar algunos patógenos?","Vía respiratoria","Solo el cabello","Solo las uñas"],["¿Por qué lavarse las manos reduce infecciones?","Disminuye el transporte de microorganismos","Elimina toda enfermedad hereditaria","Sustituye a las vacunas"],["¿Qué diferencia contagio directo e indirecto?","La intervención de intermediarios","La gravedad de la fiebre","El tamaño del patógeno"],["Completa: los organismos que transmiten algunos patógenos se denominan ___.","vectores"],["¿Qué medida ayuda frente a infecciones respiratorias?","Ventilar espacios cerrados","Compartir pañuelos","Ignorar la higiene"],["¿Qué sucede en la fase de desarrollo?","Se manifiestan síntomas y signos","No existe ningún patógeno","Siempre se ha producido la curación"],["¿Qué es un portador asintomático?","Persona que alberga un patógeno sin síntomas","Persona inmune a toda enfermedad","Persona con enfermedad hereditaria"],["¿Qué práctica limita el contagio indirecto?","Desinfectar superficies compartidas","Compartir objetos contaminados","Beber agua sin control"],["Completa: la transmisión de una infección se denomina ___.","contagio"]]},{"title":"El sistema inmunitario","intro":"El organismo dispone de defensas externas e internas. La respuesta inespecífica actúa de forma general, mientras que la específica reconoce antígenos y puede generar memoria inmunitaria.","points":[["Defensas externas","Piel, mucosas y secreciones que dificultan la entrada de patógenos."],["Respuesta inespecífica","Inflamación y actuación de células fagocíticas frente a muchos agentes."],["Respuesta específica","Linfocitos y anticuerpos dirigidos frente a antígenos determinados; puede generar memoria."]],"q":[["¿Cuál es una defensa externa?","Piel","Anticuerpo circulante","Linfocito activado"],["¿Qué es la fagocitosis?","Captura e ingestión de partículas por células","Fabricación de glóbulos rojos","Transmisión de un virus"],["¿Qué respuesta actúa frente a muchos patógenos sin reconocer uno concreto?","Inespecífica","Específica","Hereditaria"],["¿Qué moléculas reconocen antígenos de forma específica?","Anticuerpos","Glucosa","Hemoglobina"],["Completa: las células que participan en la respuesta específica son los ___.","linfocitos"],["¿Qué función tiene la piel intacta?","Dificultar la entrada de patógenos","Producir todos los anticuerpos","Transportar oxígeno"],["¿Qué proceso suele acompañar a una infección local?","Inflamación","Fotosíntesis","Digestión intestinal"],["¿Qué identifica un anticuerpo?","Un antígeno específico","Cualquier nutriente","Un glóbulo rojo al azar"],["¿Qué característica tiene la memoria inmunitaria?","Facilita una respuesta posterior más rápida","Elimina todas las defensas externas","Impide fabricar anticuerpos"],["Completa: las sustancias reconocidas por la respuesta específica se llaman ___.","antígenos"],["¿Qué células pueden realizar fagocitosis?","Fagocitos","Eritrocitos","Plaquetas"],["¿Qué opción diferencia las dos respuestas internas?","Una es general y otra reconoce antígenos concretos","Ambas dependen solo de la piel","La específica nunca usa células"],["¿Qué ocurre si se rompe la barrera cutánea?","Aumenta la posibilidad de entrada de patógenos","Desaparecen todos los linfocitos","La sangre deja de circular"],["¿Qué respuesta suele ser más rápida ante un patógeno conocido?","La respuesta con memoria inmunitaria","La primera respuesta específica","La ausencia de defensas"],["Completa: la respuesta ___ actúa de forma general.","inespecífica"],["¿Qué efecto tiene la inflamación?","Ayuda a concentrar defensas en la zona","Destruye necesariamente todos los tejidos","Impide siempre la llegada de células"],["¿Qué células participan en la producción de anticuerpos?","Linfocitos B","Glóbulos rojos","Plaquetas"],["¿Por qué la vacunación puede proteger?","Favorece la memoria inmunitaria","Sustituye a la piel","Impide toda mutación"],["¿Qué ejemplo corresponde a una barrera química?","Sustancias antimicrobianas de secreciones","Hueso compacto","Anticuerpo específico"],["Completa: la capacidad de responder mejor tras un primer contacto es memoria ___.","inmunitaria"]]},{"title":"Donaciones y trasplantes","intro":"Las donaciones permiten ayudar a otras personas mediante sangre, tejidos u órganos. Los trasplantes requieren controles médicos y compatibilidad para reducir el riesgo de rechazo.","points":[["Donación","Acto de ofrecer sangre, órganos o tejidos para ayudar a otra persona."],["Trasplante","Sustitución de un órgano o tejido dañado por otro funcional."],["Compatibilidad y rechazo","El sistema inmunitario puede reconocer como extrañas las células trasplantadas; por eso se estudia la compatibilidad."]],"q":[["¿Cuál es la finalidad de un trasplante?","Sustituir un órgano o tejido que no funciona bien","Transmitir una infección","Modificar todos los genes"],["¿Qué puede donarse?","Sangre, tejidos y órganos","Solo cabello","Solo huesos"],["¿Qué es el rechazo de un trasplante?","Respuesta inmunitaria contra tejido trasplantado","Una enfermedad contagiosa del donante","Una fase normal de la digestión"],["¿Por qué se estudia la compatibilidad?","Para reducir el riesgo de rechazo","Para aumentar la fiebre","Para evitar cualquier revisión médica"],["Completa: el sistema ___ puede reconocer como extraño el trasplante.","inmunitario"],["¿Qué ejemplo es un trasplante de órgano?","Riñón","Transfusión de plasma","Donación de sangre"],["¿Qué ejemplo corresponde a una donación de tejido?","Córnea","Glucosa","Agua"],["¿Qué puede ocurrir si el receptor reconoce el injerto como extraño?","Rechazo","Fotosíntesis","Incubación"],["¿Qué opción define mejor la donación?","Ofrecer material biológico para ayudar a otra persona","Vender siempre un órgano","Producir anticuerpos en un cultivo"],["Completa: la sustitución de un órgano dañado se llama ___.","trasplante"],["¿Qué profesional valora la idoneidad de un trasplante?","Equipo sanitario especializado","Solo el paciente","Solo un laboratorio escolar"],["¿Por qué se realizan controles previos?","Para evaluar seguridad y compatibilidad","Para eliminar toda necesidad de seguimiento","Para cambiar el grupo sanguíneo"],["¿Qué diferencia donación y trasplante?","Donar es ofrecer; trasplantar es implantar","Son términos siempre idénticos","Trasplantar es vacunar"],["¿Qué sistema está relacionado con el rechazo?","Inmunitario","Digestivo exclusivamente","Respiratorio exclusivamente"],["Completa: antes de trasplantar se estudia la ___ entre donante y receptor.","compatibilidad"],["¿Qué afirmación sobre un trasplante es correcta?","Requiere seguimiento médico","Garantiza ausencia absoluta de rechazo","No necesita valoración previa"],["¿Qué material se usa en una transfusión?","Componentes sanguíneos","Un riñón","Un pulmón"],["¿Qué actitud favorece una donación responsable?","Informarse mediante fuentes sanitarias fiables","Ignorar criterios médicos","Prometer resultados garantizados"],["¿Qué puede ser necesario para prevenir el rechazo?","Tratamiento inmunosupresor prescrito","Antibióticos para toda la vida siempre","Eliminar toda la piel"],["Completa: quien recibe el órgano es el ___.","receptor"]]}];const app=document.getElementById('app');let mode='home',section=0,qi=0,score=0,selected=null,answered=false,order=[],pool=[];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function goHome(){mode='home';render()}function render(){if(mode==='home')home();if(mode==='study')study();if(mode==='menu')menu();if(mode==='quiz')quiz()}function home(){app.innerHTML='<section class="hero"><div class="eyebrow">Tema 2 · Salud y enfermedad</div><h1>¿Cómo protege nuestro cuerpo la salud?</h1><p>Descubre los factores que afectan a la salud, cómo se transmiten las infecciones y cómo actúan nuestras defensas.</p><div class="illustration" aria-label="Salud, microorganismos, inmunidad y donación"><span>🫀</span><span>🦠</span><span>🛡️</span><span>🩺</span></div><div class="actions"><button class="primary" onclick="mode=\'study\';section=0;render()">📖 Aprender el tema</button><button class="secondary" onclick="mode=\'menu\';render()">✏️ Practicar para el examen</button></div></section><h2 style="margin-top:40px">Índice del tema</h2><div class="grid">'+B.map((b,i)=>'<div class="tile"><button onclick="mode=\'study\';section='+i+';render()"><h3>'+String(i+1).padStart(2,'0')+' · '+b.title+'</h3><small>Estudiar el apartado →</small></button></div>').join('')+'</div>'}
function study(){const b=B[section];app.innerHTML='<div class="study"><div class="eyebrow">Aprende · '+(section+1)+' de '+B.length+'</div><h2>'+b.title+'</h2><p>'+b.intro+'</p><div class="grid">'+b.points.map((p,i)=>'<article class="detail"><h3>'+p[0]+'</h3><p>'+p[1]+'</p></article>').join('')+'</div><div class="illustration"><span>'+(section===0?'🏃':section===1?'🩺':section===2?'🦠':section===3?'🛡️':'❤️')+'</span><p style="max-width:650px"><strong>Para pensar:</strong> '+['¿Qué factores de riesgo puedes modificar y cuáles no?','¿Por qué una enfermedad no infecciosa no se transmite por contagio?','¿Cómo se puede interrumpir una cadena de contagio?','¿Por qué una segunda exposición al mismo patógeno puede generar una respuesta más rápida?','¿Por qué se estudia la compatibilidad antes de un trasplante?'][section]+'</p></div></div><div class="nav"><button class="secondary" onclick="section=Math.max(0,section-1);render()">← Anterior</button><button class="primary" onclick="startQuiz('+section+')">Practicar este apartado</button><button class="secondary" onclick="section=Math.min(B.length-1,section+1);render()">Siguiente →</button></div>'}
function menu(){app.innerHTML='<div class="eyebrow">Autoevaluación</div><h2>Practica y prepárate para el examen</h2><p>Elige un epígrafe para responder a sus 20 preguntas o practica con preguntas mezcladas. Hay preguntas de elección múltiple y de completar.</p><div class="grid">'+B.map((b,i)=>'<div class="tile"><h3>'+b.title+'</h3><p class="hint">20 preguntas · corrección inmediata</p><button class="primary" onclick="startQuiz('+i+')">Empezar →</button></div>').join('')+'<div class="tile"><h3>🔀 Repaso de todo el tema</h3><p class="hint">20 preguntas mezcladas</p><button class="primary" onclick="startQuiz(-1)">Empezar →</button></div></div>'}
function startQuiz(s){section=s;mode='quiz';qi=0;score=0;selected=null;answered=false;pool=s<0?shuffle(B.flatMap(b=>b.q)).slice(0,20):shuffle(B[s].q);render()}function normalize(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/\s+/g,' ')}function quiz(){if(qi>=pool.length){app.innerHTML='<div class="quizbox"><div class="eyebrow">Resultado</div><h2>'+score+' / '+pool.length+' respuestas correctas</h2><p>'+(score>=16?'¡Buen trabajo! Repasa los errores para consolidar los conceptos.':'Revisa los apartados que te han resultado más difíciles y vuelve a intentarlo.')+'</p><div class="actions"><button class="primary" onclick="startQuiz('+section+')">Repetir con otro orden</button><button class="secondary" onclick="mode=\'menu\';render()">Elegir apartado</button></div></div>';return}let q=pool[qi];let fill=q.length===2;order=fill?[]:shuffle([q[1],q[2],q[3]]);app.innerHTML='<div class="eyebrow">'+(section<0?'Repaso general':B[section].title)+'</div><h2>Pregunta '+(qi+1)+' de '+pool.length+'</h2><div class="progress"><div style="width:'+qi/pool.length*100+'%"></div></div><div class="quizbox"><h3>'+q[0]+'</h3>'+(fill?'<input class="answer" id="fill" autocomplete="off" placeholder="Escribe tu respuesta">':order.map((o,i)=>'<button class="option" onclick="choose('+i+')" id="opt'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join(''))+'<div class="actions"><button class="primary" id="check" onclick="check()">Comprobar</button><button class="secondary hidden" id="next" onclick="qi++;selected=null;answered=false;render()">Siguiente →</button></div><div id="feedback" aria-live="polite"></div></div>'}
function choose(i){if(answered)return;selected=order[i];document.querySelectorAll('.option').forEach((e,j)=>e.classList.toggle('selected',j===i))}
function check(){if(answered)return;let q=pool[qi];let v=q.length===2?document.getElementById('fill').value:selected;if(!v||!String(v).trim())return;answered=true;let ok=normalize(v)===normalize(q[1]);if(ok)score++;document.getElementById('feedback').innerHTML='<div class="feedback '+(ok?'':'bad')+'"><strong>'+(ok?'✓ Correcto':'✗ Revisa la respuesta')+'</strong><p>Respuesta esperada: <strong>'+q[1]+'</strong>.</p></div>';document.getElementById('check').classList.add('hidden');document.getElementById('next').classList.remove('hidden');document.querySelectorAll('.option').forEach(e=>e.disabled=true);let f=document.getElementById('fill');if(f)f.disabled=true}
render();
</script></body></html>
