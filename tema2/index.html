<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tema 2 · Salud, enfermedad y sistema inmunitario</title><style>
:root{--navy:#172c4e;--mint:#dcf6e8;--pink:#ffe4ec;--lav:#eee6ff;--peach:#ffebd9;--blue:#e5f2ff;--yellow:#fff2b9}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:var(--navy);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,a{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}.screen{width:min(1350px,96vw);margin:22px auto 0;flex:1;background:#fff;border-radius:28px;box-shadow:0 16px 55px #142c4a15;padding:clamp(24px,4vw,58px);min-height:74vh}.topline{display:flex;align-items:center;justify-content:space-between;color:#64728a;font-weight:800;letter-spacing:.1em;font-size:13px}.tag{background:#d6f3e5;color:#20684d;padding:9px 16px;border-radius:30px}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:35px;align-items:center;padding:22px 0 36px}.hero h1{font-size:clamp(36px,5vw,76px);line-height:1.04;letter-spacing:-.045em;margin:15px 0}.hero p{font-size:clamp(19px,2vw,26px);font-weight:650}.highlight{background:linear-gradient(transparent 55%,#ffeb8b 55%)}.hero-art{border-radius:30px;min-height:280px;background:linear-gradient(140deg,#c5f0e5,#e3edff 60%,#ffe1d8);display:grid;place-items:center;font-size:clamp(90px,13vw,190px);position:relative}.hero-art small{position:absolute;right:12px;bottom:15px;font-size:16px;background:white;border-radius:20px;padding:9px 13px}.section-title{font-size:19px;letter-spacing:.12em}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.tile{border:0;border-radius:20px;padding:24px;text-align:left;min-height:192px;color:var(--navy);transition:transform .2s}.tile:hover{transform:translateY(-4px)}.tile strong{display:block;font-size:clamp(19px,2vw,27px);margin:12px 0}.tile span{font-size:16px;line-height:1.4}.mint{background:var(--mint)}.pink{background:var(--pink)}.lav{background:var(--lav)}.peach{background:var(--peach)}.blue{background:var(--blue)}.yellow{background:var(--yellow)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.mini{min-height:104px}.screen h2{font-size:clamp(32px,4vw,60px);line-height:1.12;letter-spacing:-.035em;margin:24px 0}.lead{font-size:clamp(20px,2.3vw,29px);line-height:1.45}.scenario-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}.scenario{border-radius:24px;padding:25px;min-height:285px}.scenario .emoji{font-size:75px}.scenario h3{font-size:25px;margin:10px 0}.scenario p{font-size:21px;line-height:1.4}.question{padding:17px 23px;border-left:7px solid #ffcd5e;background:#fff7da;border-radius:12px;margin-top:24px;font-size:23px;font-weight:700}.definition{font-size:clamp(25px,3.2vw,42px);line-height:1.7;margin:34px 0}.mark{border-radius:7px;padding:0 3px;transition:background .2s}.mark.on{background:#ffeb89}.subnote{font-size:20px;color:#596983}.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.risk{padding:23px;border-radius:22px}.risk h3{font-size:28px}.risk p{font-size:20px;line-height:1.45}.story{background:#e9f1fb;border-radius:25px;padding:27px;margin:20px 0}.story h3{font-size:clamp(24px,3vw,38px);margin:0 0 10px}.story p{font-size:21px}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.reel{padding:22px;border-radius:22px;background:#fff0f5}.reel a{display:inline-block;background:#172c4e;color:#fff;text-decoration:none;padding:12px 17px;border-radius:14px;font-weight:700}.reel p{font-size:18px}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px max(2vw,20px);width:min(1350px,96vw);margin:auto}.nav button{border:0;border-radius:16px;background:#172c4e;color:white;padding:12px 19px;font-weight:800}.nav button:disabled{opacity:.3;cursor:default}.nav .home{background:#e0edf8;color:#172c4e}.nav .counter{font-weight:700;color:#63738a}.cta{border:0;border-radius:15px;padding:15px 22px;background:#172c4e;color:white;font-size:20px;font-weight:750}.notice{background:#f1f4f8;border-radius:20px;padding:25px;font-size:20px;line-height:1.5}.hide{display:none!important}@media(max-width:900px){.hero{grid-template-columns:1fr}.hero-art{min-height:160px;font-size:90px}.grid4,.grid3,.scenario-grid,.risk-grid,.reels{grid-template-columns:1fr 1fr}.screen{min-height:0}}@media(max-width:600px){.grid4,.grid3,.scenario-grid,.risk-grid,.reels{grid-template-columns:1fr}.screen{padding:22px}.scenario{min-height:0}.hero-art{display:none}}
 .screen:has(.cover-visual){padding:0;overflow:hidden;min-height:0}.cover-visual{position:relative;width:100%;aspect-ratio:3/2;background:#e9f5fa}.cover-visual img{display:block;width:100%;height:100%;object-fit:contain}.hotspot{position:absolute;background:transparent;border:2px solid transparent;border-radius:12px;cursor:pointer}.hotspot:hover,.hotspot:focus-visible{background:#ffffff22;border-color:#ffcd5e;outline:none}.cover-visual h1{font-size:clamp(28px,5vw,70px)} .influencer-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:22px 0 34px}.influencer-card{display:block;text-decoration:none;color:var(--navy);border-radius:22px;padding:22px;background:#eef5fc;border:2px solid transparent;min-height:250px}.influencer-card:nth-child(3n+2){background:#fff0f5}.influencer-card:nth-child(3n){background:#e9f7ed}.influencer-card:hover,.influencer-card:focus-visible{border-color:#497ac6;transform:translateY(-2px)}.influencer-card h3{font-size:25px;margin:10px 0}.influencer-card p{font-size:18px;line-height:1.4}.influencer-avatar{font-size:58px}@media(max-width:850px){.influencer-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.influencer-grid{grid-template-columns:1fr}} </style></head><body><div class="app"><main id="screen" class="screen" aria-live="polite"></main><nav class="nav"><button id="prev">← Anterior</button><button id="home" class="home" title="Ir al índice">⌂ Índice</button><span id="counter" class="counter"></span><button id="next">Siguiente →</button></nav></div><script>
const reels=['https://www.instagram.com/reel/DWedfs0D8OE/?hl=es','https://www.instagram.com/reel/DW3I2KPx617/?hl=es','https://www.instagram.com/reel/DXNCNl3CPkp/?hl=es'];let slide=0,marks=0;
const slides=[
()=>`<div class="topline"><span class="tag">TEMA 2 · BIOLOGÍA Y GEOLOGÍA · 3.º ESO</span><span>COLEGIO PUNTA GALEA · BIOLOGÍA</span></div><section class="hero"><div><h1>La salud, la enfermedad y el sistema inmunitario</h1><p><span class="highlight">Mucho más que no estar enfermo</span></p></div><div class="hero-art" aria-hidden="true">🧑‍⚕️<small>🫀 🦠 🛡️</small></div></section><h2 class="section-title">ÍNDICE DEL TEMA</h2><div class="grid4"><button class="tile mint" onclick="go(1)"><strong>💚 La salud</strong><span>Bienestar y factores de riesgo</span></button><button class="tile pink" onclick="go(4)"><strong>🦠 La enfermedad</strong><span>Causas y tipos de enfermedades</span></button><button class="tile lav" onclick="go(4)"><strong>🛡️ El sistema inmunitario</strong><span>Defensas, vacunas y sueros</span></button><button class="tile peach" onclick="go(4)"><strong>❤️ Donaciones y trasplantes</strong><span>Solidaridad y salud</span></button></div><div class="grid3"><button class="tile mini blue" onclick="go(4)"><strong>🔬 Laboratorio de competencias</strong></button><button class="tile mini yellow" onclick="go(5)" title="Abrir las fichas de divulgadores"><strong>📱 Influencers de la salud</strong></button><button class="tile mini pink" onclick="go(4)"><strong>✍️ Autoevaluación</strong></button></div>`,
()=>`<div class="topline"><span>01 · LA SALUD</span><span class="tag">PENSAMOS ANTES DE APRENDER</span></div><h2>¿No estar enfermo significa estar sano?</h2><p class="lead">Observa estas tres situaciones. ¿Quién tiene buena salud? ¿Por qué?</p><div class="scenario-grid"><article class="scenario mint"><div class="emoji">🏃</div><h3>Álex</h3><p>No tiene ninguna enfermedad diagnosticada, pero duerme cuatro horas y vive agotado.</p></article><article class="scenario pink"><div class="emoji">😟</div><h3>Lucía</h3><p>No tiene fiebre ni dolor, pero se siente sola y está muy preocupada.</p></article><article class="scenario lav"><div class="emoji">🚴</div><h3>Dani</h3><p>Tiene una enfermedad crónica controlada, hace deporte y disfruta de su vida diaria.</p></article></div><div class="question">💬 ¿Basta con no tener una enfermedad para disfrutar de buena salud? Justifica tu respuesta.</div><p><a href="#" onclick="go(5);return false">📱 Influencers de la salud ↗</a></p>`,
()=>`<div class="topline"><span>01 · LA SALUD</span><span class="tag">DEFINICIÓN DEL LIBRO</span></div><h2>¿Qué es la salud?</h2><div class="definition">La <span class="mark">salud</span> es un estado de <span class="mark">bienestar y equilibrio físico y emocional</span>, caracterizado por la <span class="mark">ausencia de enfermedad o cualquier tipo de dolencia</span>, en el que el individuo <span class="mark">es capaz de desarrollar una vida individual y socialmente plena y productiva</span>.</div><button class="cta" onclick="markNext()">✏️ Subrayar lo importante</button><p class="subnote">Pulsa para destacar la definición por partes, como lo haríamos en clase.</p>`,
()=>`<div class="topline"><span>01 · LA SALUD</span><span class="tag">FACTORES DE RIESGO</span></div><h2>¿Vapear es realmente inofensivo?</h2><div class="story"><h3>🚨 Un caso real que invita a pensar</h3><p>En Estados Unidos se investigó un brote de lesiones pulmonares graves relacionadas con el vapeo en 2019-2020. Muchos casos estaban vinculados a productos con THC y acetato de vitamina E: no significa que todos los vapeadores causen esa lesión.</p><p><a href="https://archive.cdc.gov/www_cdc_gov/media/releases/2020/s0225-EVALI-cases-deaths.html" target="_blank" rel="noopener">Leer la información de los CDC ↗</a></p></div><div class="question">💬 ¿Por qué vapear puede ser un factor de riesgo para la salud de un adolescente?</div><p class="lead"><strong>Factor de riesgo:</strong> característica, condición o comportamiento que puede comprometer la salud de una persona.</p><div class="risk-grid"><article class="risk mint"><h3>🚭 Conductuales</h3><p>Comportamientos que podemos modificar: vapear, fumar, dieta poco saludable o sedentarismo.</p></article><article class="risk pink"><h3>🧬 Biológicos</h3><p>Características del organismo: predisposición genética, hipertensión o envejecimiento.</p></article><article class="risk lav"><h3>🌍 Ambientales</h3><p>Condiciones del entorno: contaminación, tráfico o ambiente laboral y social.</p></article></div><div class="question">🎬 Vídeos para analizar: ¿qué riesgos del vapeo explican los profesionales?</div><h3 class="section-title">REELS PARA ANALIZAR EN CLASE</h3><div class="reels">${reels.map((r,i)=>`<article class="reel"><h3>Vídeo ${i+1}</h3><p>¿Quién habla? ¿Qué profesión tiene? ¿Qué evidencia aporta sobre el tabaco o el vapeo?</p><a href="${r}" target="_blank" rel="noopener noreferrer">Ver reel ↗</a></article>`).join('')}</div>`,
()=>`<div class="topline"><span>TEMA 2 · EN CONSTRUCCIÓN</span><span class="tag">PRÓXIMAS DIAPOSITIVAS</span></div><h2>Seguiremos construyendo este tema juntos</h2><div class="notice">Esta es la primera versión de la presentación. Los apartados de enfermedad, sistema inmunitario, donaciones y trasplantes, el laboratorio de competencias y la autoevaluación se incorporarán cuando revisemos y aprobemos sus diapositivas.</div><p class="lead">Mientras tanto, puedes volver al índice o explorar los reels que has seleccionado.</p><button class="cta" onclick="go(5)">🎬 Ver influencers de la salud</button>`,
()=>`<div class="topline"><span>TEMA 2 · RECURSOS</span><span class="tag">INFLUENCERS DE LA SALUD</span></div><h2>📱 Influencers de la salud</h2><p class="lead">Conoce a divulgadores que explican la ciencia y la salud en redes sociales. Pulsa en cada tarjeta para abrir su perfil.</p><div class="influencer-grid"><a class="influencer-card" href="https://www.instagram.com/boticariagarcia/" target="_blank" rel="noopener"><div class="influencer-avatar">💊</div><h3>Boticaria García</h3><p>Doctora en Farmacia y nutricionista. Explica salud, alimentación y desmonta bulos.</p><b>Ver perfil ↗</b></a><a class="influencer-card" href="https://www.instagram.com/farmaceuticofernandez/" target="_blank" rel="noopener"><div class="influencer-avatar">🧪</div><h3>Farmacéutico Fernández</h3><p>Álvaro Fernández, farmacéutico. Divulga sobre medicamentos y hábitos saludables con humor.</p><b>Ver perfil ↗</b></a><a class="influencer-card" href="https://www.instagram.com/davidcallejo10/" target="_blank" rel="noopener"><div class="influencer-avatar">🩺</div><h3>David Callejo</h3><p>Médico anestesiólogo y divulgador de información sanitaria.</p><b>Ver perfil ↗</b></a><a class="influencer-card" href="https://www.instagram.com/lahiperactina/" target="_blank" rel="noopener"><div class="influencer-avatar">🔬</div><h3>La Hiperactina</h3><p>Sandra Ortonobes, biomédica. Explica biología, cuerpo humano y ciencia.</p><b>Ver perfil ↗</b></a><a class="influencer-card" href="https://www.instagram.com/miguel_assal/" target="_blank" rel="noopener"><div class="influencer-avatar">🚒</div><h3>Miguel Assal</h3><p>Profesional de emergencias y divulgador de primeros auxilios y prevención. Colabora en vídeos con el cirujano torácico Diego González Rivas.</p><b>Ver perfil ↗</b></a><a class="influencer-card" href="https://www.instagram.com/dieguinidoc/" target="_blank" rel="noopener"><div class="influencer-avatar">🫁</div><h3>Diego González Rivas</h3><p>Cirujano torácico. Explica los riesgos del tabaco y del vapeo para los pulmones.</p><b>Ver perfil ↗</b></a></div><div class="question">💬 ¿Por qué no debemos creer automáticamente todo lo que dice un influencer, aunque tenga muchos seguidores?</div>`
];
function render(){document.getElementById('screen').innerHTML=slides[slide]();document.getElementById('prev').disabled=slide===0;document.getElementById('next').disabled=slide===slides.length-1;document.getElementById('counter').textContent=(slide+1)+' / '+slides.length;marks=0;window.scrollTo({top:0,behavior:'instant'})}function go(n){slide=Math.max(0,Math.min(slides.length-1,n));render()}function markNext(){const el=document.querySelectorAll('.mark');if(marks>=el.length){el.forEach(e=>e.classList.remove('on'));marks=0}else{el[marks].classList.add('on');marks++}}document.getElementById('prev').onclick=()=>go(slide-1);document.getElementById('next').onclick=()=>go(slide+1);document.getElementById('home').onclick=()=>go(0);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,button,a'))return;if(e.key==='ArrowRight')go(slide+1);if(e.key==='ArrowLeft')go(slide-1);if(e.key==='Home')go(0)});render();
</script></body></html>
